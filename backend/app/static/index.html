<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fridge & Nutrition Coach</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10">
    <div class="max-w-xl mx-auto bg-white rounded-xl shadow p-8">
        <h1 class="text-2xl font-bold text-emerald-700 mb-6">🥗 Calcule tes besoins nutritionnels</h1>

        <form id="profile-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Poids (kg)</label>
                <input type="number" step="0.1" name="poids_kg" required class="w-full border rounded-lg px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Taille (cm)</label>
                <input type="number" step="0.1" name="taille_cm" required class="w-full border rounded-lg px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Âge</label>
                <input type="number" name="age" required class="w-full border rounded-lg px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Sexe</label>
                <select name="sexe" class="w-full border rounded-lg px-3 py-2">
                    <option value="homme">Homme</option>
                    <option value="femme">Femme</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Niveau d'activité</label>
                <select name="niveau_activite" class="w-full border rounded-lg px-3 py-2">
                    <option value="sédentaire">Sédentaire</option>
                    <option value="léger">Légèrement actif</option>
                    <option value="modéré">Modérément actif</option>
                    <option value="actif">Très actif</option>
                    <option value="extrême">Extrêmement actif</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Objectif</label>
                <select name="objectif" class="w-full border rounded-lg px-3 py-2">
                    <option value="perte">Perte de poids</option>
                    <option value="maintien">Maintien</option>
                    <option value="prise">Prise de masse</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-emerald-600 text-white font-semibold py-2 rounded-lg hover:bg-emerald-700">
                Calculer
            </button>
        </form>

        <div id="result" class="mt-6 hidden">
            <h2 class="text-lg font-bold mb-3">Résultats</h2>
            <div class="grid grid-cols-2 gap-3 text-sm">
                <div class="bg-gray-100 rounded-lg p-3"><span class="text-gray-500">BMR</span><p id="r-bmr" class="text-xl font-bold"></p></div>
                <div class="bg-gray-100 rounded-lg p-3"><span class="text-gray-500">TDEE</span><p id="r-tdee" class="text-xl font-bold"></p></div>
                <div class="bg-emerald-100 rounded-lg p-3 col-span-2"><span class="text-gray-500">Calories cibles</span><p id="r-calories" class="text-2xl font-bold text-emerald-700"></p></div>
                <div class="bg-blue-50 rounded-lg p-3"><span class="text-gray-500">Protéines</span><p id="r-protein" class="text-lg font-bold"></p></div>
                <div class="bg-yellow-50 rounded-lg p-3"><span class="text-gray-500">Glucides</span><p id="r-carbs" class="text-lg font-bold"></p></div>
                <div class="bg-red-50 rounded-lg p-3"><span class="text-gray-500">Lipides</span><p id="r-fat" class="text-lg font-bold"></p></div>
            </div>
        </div>

        <p id="error" class="mt-4 text-red-600 text-sm hidden"></p>
        <p class="mt-4 text-xs text-gray-400"></p>
    </div>
</body>
</html>
